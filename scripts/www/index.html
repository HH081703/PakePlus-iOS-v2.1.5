                this.elements.pluginPanelClose.addEventListener('click', () => this.hidePluginManager());
                this.elements.pluginPanelOverlay.addEventListener('click', () => this.hidePluginManager());
                

            }
            

            

            
            // 更新返回按钮显示状态
            updateBackButtons() {
                for (let pageNum = 1; pageNum <= 3; pageNum++) {
                    const backBtn = document.getElementById(`backBtn${pageNum}`);
                    const tabsInPage = this.tabs.filter(tab => tab.containerPage === pageNum);
                    
                    if (backBtn) {
                        if (tabsInPage.length > 0) {
                            backBtn.classList.add('hidden');
                        } else {
                            backBtn.classList.remove('hidden');
                        }
                    }
                }
            }
            
            // 更新容器页面徽章
            updateContainerBadges() {
                for (let pageNum = 1; pageNum <= 3; pageNum++) {
                    const count = this.tabs.filter(tab => tab.containerPage === pageNum).length;
                    
                    // 更新空状态显示
                    const emptyState = document.getElementById(`containerEmptyState${pageNum}`);
                    if (emptyState) {
                        if (count === 0) {
                            emptyState.classList.add('active');
                        } else {
                            emptyState.classList.remove('active');
                        }
                    }
                }
                
                // 更新返回按钮显示状态
                this.updateBackButtons();
            }
            
            // 设置插件管理器
            setupPluginManager() {
                document.getElementById('importPluginBtn').addEventListener('click', () => this.importPlugin());
                document.getElementById('createPluginBtn').addEventListener('click', () => this.createPlugin());
                document.getElementById('refreshPluginsBtn').addEventListener('click', () => this.refreshPlugins());
                this.renderPluginList();
            }
            
            // 页面切换
            switchToPage(pageIndex) {
                if (this.isAnimating || this.currentPageIndex === pageIndex) return;
                
                this.isAnimating = true;
                const offset = -pageIndex * 100;
                this.elements.pageContainer.style.transform = `translateX(${offset}vw)`;
                this.currentPageIndex = pageIndex;
                
                setTimeout(() => {
                    this.isAnimating = false;
                }, 300);
            }
            
            // 滑动监听 - 现在添加到容器的标题栏
            addSwipeListeners(element) {
                let startX = 0;
                let startY = 0;
                let isSwiping = false;
                const threshold = 50;
                
                // 触摸事件
                element.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    isSwiping = true;
                }, { passive: true });
                
                element.addEventListener('touchmove', (e) => {
                    if (!isSwiping) return;
                    
                    const currentX = e.touches[0].clientX;
                    const currentY = e.touches[0].clientY;
                    const deltaX = currentX - startX;
                    const deltaY = currentY - startY;
                    
                    // 如果垂直滑动大于水平滑动，则不处理
                    if (Math.abs(deltaY) > Math.abs(deltaX)) return;
                    
                    // 防止页面滚动
                    e.preventDefault();
                }, { passive: false });
                
                element.addEventListener('touchend', (e) => {
                    if (!isSwiping) return;
                    
                    const endX = e.changedTouches[0].clientX;
                    const deltaX = endX - startX;
                    
                    if (Math.abs(deltaX) > threshold) {
                        if (deltaX > 0) {
                            this.swipeToPrevious();
                        } else {
                            this.swipeToNext();
                        }
                    }
                    
                    isSwiping = false;
                }, { passive: true });
                
                // 鼠标事件（用于桌面端测试）
                element.addEventListener('mousedown', (e) => {
                    startX = e.clientX;
                    startY = e.clientY;
                    isSwiping = true;
                    e.preventDefault();
                });
                
                element.addEventListener('mousemove', (e) => {
                    if (!isSwiping) return;
                    
                    e.preventDefault();
                });
                
                element.addEventListener('mouseup', (e) => {
                    if (!isSwiping) return;
                    
                    const endX = e.clientX;
                    const deltaX = endX - startX;
                    
                    if (Math.abs(deltaX) > threshold) {
                        if (deltaX > 0) {
                            this.swipeToPrevious();
                        } else {
                            this.swipeToNext();
                        }
                    }
                    
                    isSwiping = false;
                });
                
                element.addEventListener('mouseleave', () => {
                    isSwiping = false;
                });
            }
            
            // 向左滑动
            swipeToPrevious() {
                if (this.currentPageIndex > 0) {
                    this.switchToPage(this.currentPageIndex - 1);
                }
            }
            
            // 向右滑动
            swipeToNext() {
                if (this.currentPageIndex < 3) {
                    this.switchToPage(this.currentPageIndex + 1);
                }
            }
            
            // 导入账号
            importAccount() {
                console.log('[MultiTabBrowser] 导入账号函数被调用');
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = '.bin';
                fileInput.style.display = 'none';
                
                fileInput.onchange = (e) => {
                    if (e.target.files[0]) {
                        console.log('[MultiTabBrowser] 选择了文件:', e.target.files[0].name);
                        this.processAccountFile(e.target.files[0]);
                    }
                };
                
                document.body.appendChild(fileInput);
                fileInput.click();
                setTimeout(() => {
                    if (fileInput.parentNode) {
                        document.body.removeChild(fileInput);
                    }
                }, 100);
            }
            
            // 批量导入
            batchImportAccounts() {
                console.log('[MultiTabBrowser] 批量导入函数被调用');
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = '.bin';
                fileInput.multiple = true;
                fileInput.style.display = 'none';
                
                fileInput.onchange = (e) => {
                    const files = Array.from(e.target.files);
                    console.log(`[MultiTabBrowser] 选择了 ${files.length} 个文件`);
                    files.forEach((file, index) => {
                        setTimeout(() => this.processAccountFile(file), index * 100);
                    });
                };
                
                document.body.appendChild(fileInput);
                fileInput.click();
                setTimeout(() => {
                    if (fileInput.parentNode) {
                        document.body.removeChild(fileInput);
                    }
                }, 100);
            }
            
            processAccountFile(file) {
                return new Promise((resolve, reject) => {
                    if (!file.name.endsWith('.bin')) {
                        alert('请选择.bin格式的文件');
                        return reject(new Error('无效的文件格式'));
                    }
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const bytes = new Uint8Array(e.target.result);
                            let hexContent = '';
                            for (let i = 0; i < bytes.length; i++) {
                                hexContent += bytes[i].toString(16).padStart(2, '0');
                            }
                            
                            const account = this.accountManager.addAccount(
                                file.name,
                                hexContent,
                                this.formatFileSize(file.size),
                                {
                                    bytes: Array.from(bytes),
                                    size: file.size,
                                    lastModified: file.lastModified
                                }
                            );
                            
                            this.createAccountCard(account);
                            this.hideAccountEmptyState();
                            console.log('[MultiTabBrowser] 账号导入成功:', account.fileName);
                            resolve(account);
                        } catch (error) {
                            console.error('[MultiTabBrowser] 处理账号文件失败:', error);
                            reject(error);
                        }
                    };
                    reader.readAsArrayBuffer(file);
                });
            }
            
            // 创建账号卡片
            createAccountCard(account) {
                const card = document.createElement('div');
                card.className = 'account-card';
                card.dataset.accountId = account.id;
                
                const isActive = account.containerId ? true : false;
                const statusText = isActive ? `已启动 (页${account.containerPage})` : '未启动';
                const statusClass = isActive ? 'active' : 'inactive';
                
                card.innerHTML = `
                    <div class="account-card-header">
                        <div class="account-card-filename" title="${account.fileName}">
                            <i class="fas fa-file-alt"></i> ${this.escapeHtml(account.fileName)}
                        </div>
                        <div class="account-card-controls">
                            <span class="account-card-status ${statusClass}">
                                <i class="fas fa-${isActive ? 'check-circle' : 'circle'}"></i>
                                <span>${statusText}</span>
                            </span>
                        </div>
                    </div>
                    <div class="account-card-footer">
                        <div class="account-card-time">
                            <i class="far fa-clock"></i>
                            <span>${this.formatDate(new Date(account.importTime))}</span>
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    this.showActionPanel(account.id);
                });
                
                this.elements.accountList.appendChild(card);
                account.cardElement = card;
                return card;
            }
            
            // 显示操作面板
            showActionPanel(accountId) {
                const account = this.accountManager.getAccount(accountId);
                if (!account) return;
                
                this.selectedAccountId = accountId;
                this.elements.actionPanelTitle.textContent = account.fileName;
                this.elements.actionPanelBody.innerHTML = '';
                
                const isActive = account.containerId ? true : false;
                const actions = [];
                
                if (!isActive) {
                    actions.push({ name: '启动容器', action: () => this.launchAccount(accountId) });
                    actions.push({ name: '启动并选择页面', action: () => this.launchAccountWithPage(accountId) });
                } else {
                    actions.push({ name: '前往容器', action: () => this.goToContainer(accountId) });
                    actions.push({ name: '关闭容器', action: () => this.closeAccountContainer(accountId) });
                    actions.push({ name: '刷新容器', action: () => this.refreshAccountContainer(accountId) });
                    actions.push({ name: '移动到其他页面', action: () => this.moveAccountToPage(accountId) });
                }
                
                actions.push({ name: '删除账号', action: () => { this.deleteAccount(accountId); this.hideActionPanel(); } });
                actions.push({ name: '编辑名称', action: () => { this.editAccount(accountId); this.hideActionPanel(); } });
                
                actions.forEach(action => {
                    const button = document.createElement('button');
                    button.className = 'action-btn';
                    button.textContent = action.name;
                    button.addEventListener('click', action.action);
                    this.elements.actionPanelBody.appendChild(button);
                });
                
                this.elements.accountActionPanel.classList.add('active');
                this.elements.actionPanelOverlay.classList.add('active');
            }
            
            hideActionPanel() {
                this.elements.accountActionPanel.classList.remove('active');
                this.elements.actionPanelOverlay.classList.remove('active');
                this.selectedAccountId = null;
            }
            
            // 启动账号容器
            async launchAccount(accountId) {
                const account = this.accountManager.getAccount(accountId);
                if (!account) return;
                
                // 如果已经启动，直接前往
                if (account.containerId) {
                    this.goToContainer(accountId);
                    this.hideActionPanel();
                    return;
                }
                
                // 获取下一个可用的容器页面
                const containerPage = this.nextContainerPage;
                const tabId = await this.createTabForAccount(account, containerPage);
                this.accountManager.linkToContainer(accountId, containerPage, tabId);
                this.updateAccountCardStatus(accountId);
                this.switchToPage(containerPage);
                this.updateContainerBadges();
                this.hideActionPanel();
                
                this.updateNextContainerPage();
            }
            
            // 启动并选择页面
            launchAccountWithPage(accountId) {
                const account = this.accountManager.getAccount(accountId);
                if (!account) return;
                
                const pageChoice = prompt('请选择容器页面 (1, 2, 3):', this.nextContainerPage);
                const containerPage = parseInt(pageChoice) || this.nextContainerPage;
                
                if (containerPage < 1 || containerPage > 3) {
                    alert('容器页面必须在1-3之间');
                    return;
                }
                
                if (account.containerId) {
                    this.closeAccountContainer(accountId);
                }
                
                this.createTabForAccount(account, containerPage).then(tabId => {
                    this.accountManager.linkToContainer(accountId, containerPage, tabId);
                    this.updateAccountCardStatus(accountId);
                    this.switchToPage(containerPage);
                    this.updateContainerBadges();
                    this.hideActionPanel();
                });
            }
            
            // 前往容器
            goToContainer(accountId) {
                const account = this.accountManager.getAccount(accountId);
                if (account && account.containerPage) {
                    this.switchToPage(account.containerPage);
                    this.hideActionPanel();
                }
            }
            
            // 关闭容器
            closeAccountContainer(accountId) {
                const account = this.accountManager.getAccount(accountId);
                if (!account || !account.containerId) return;
                
                this.closeTab(account.containerId);
                this.updateAccountCardStatus(accountId);
                this.updateContainerBadges();
                this.hideActionPanel();
            }
            
            // 刷新容器
            refreshAccountContainer(accountId) {
                const account = this.accountManager.getAccount(accountId);
                if (!account || !account.containerId) return;
                
                const tab = this.tabs.find(t => t.id === account.containerId);
                if (tab && tab.frameElement) {
                    const iframe = tab.frameElement.querySelector('iframe');
                    if (iframe) {
                        iframe.src = iframe.src;
                    }
                }
                
                this.hideActionPanel();
            }
            
            // 移动到其他页面
            moveAccountToPage(accountId) {
                const account = this.accountManager.getAccount(accountId);
                if (!account || !account.containerId) return;
                
                const pageChoice = prompt('请选择新的容器页面 (1, 2, 3):', account.containerPage);
                const newPage = parseInt(pageChoice);
                
                if (newPage < 1 || newPage > 3 || newPage === account.containerPage) return;
                
                const tab = this.tabs.find(t => t.id === account.containerId);
                if (tab) {
                    tab.containerPage = newPage;
                    account.containerPage = newPage;
                    this.accountManager.saveAccounts();
                    this.updateAccountCardStatus(accountId);
                    
                    // 移动frameElement到新的容器
                    if (tab.frameElement) {
                        const oldContainer = document.getElementById(`tabsContainer${account.containerPage}`);
                        const newContainer = document.getElementById(`tabsContainer${newPage}`);
                        if (oldContainer && newContainer) {
                            newContainer.appendChild(tab.frameElement);
                        }
                    }
                    
                    this.updateContainerBadges();
                    this.hideActionPanel();
                }
            }
            
            // 更新账号卡片状态
            updateAccountCardStatus(accountId) {
                const account = this.accountManager.getAccount(accountId);
                if (!account || !account.cardElement) return;
                
                const card = account.cardElement;
                const statusEl = card.querySelector('.account-card-status');
                if (!statusEl) return;
                
                const isActive = account.containerId ? true : false;
                const statusText = isActive ? `已启动 (页${account.containerPage})` : '未启动';
                const statusClass = isActive ? 'active' : 'inactive';
                
                statusEl.className = `account-card-status ${statusClass}`;
                statusEl.innerHTML = `<i class="fas fa-${isActive ? 'check-circle' : 'circle'}"></i><span>${statusText}</span>`;
            }
            
            // 创建标签页
            createTab(title, url, containerPage, accountId = null, accountData = null) {
                return new Promise((resolve) => {
                    const tabId = ++this.tabCounter;
                    
                    const tab = {
                        id: tabId,
                        title: title,
                        url: url,
                        created: new Date(),
                        active: false,
                        accountId: accountId,
                        containerPage: containerPage,
                        accountData: accountData,
                        frameElement: null
                    };
                    
                    this.tabs.push(tab);
                    this.createFrameElement(tab);
                    this.activateTab(tabId);
                    this.saveTabsToStorage();
                    
                    resolve(tabId);
                });
            }
            
            // 为账号创建标签页
            createTabForAccount(account, containerPage, url = this.defaultGameUrl) {
                return this.createTab(
                    account.fileName.replace('.bin', ''),
                    url,  // 使用 xyzw.html
                    containerPage,
                    account.id,
                    account.hexContent
                );
            }
            
            // 创建框架元素 - 容器填满整个容器页面
            createFrameElement(tab) {
                const frame = document.createElement('div');
                frame.className = 'tab-frame';
                frame.dataset.tabId = tab.id;
                
                frame.innerHTML = `
                    <div class="tab-header">
                        <span class="tab-header-title">${this.escapeHtml(tab.title)}</span>
                        <div class="tab-header-controls">
                            <div class="tab-header-menu">
                                <button class="tab-menu-btn" title="容器菜单">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                                <div class="tab-context-menu">
                                    <div class="tab-context-menu-item" data-action="activate">
                                        <i class="fas fa-play"></i>
                                        激活容器
                                    </div>
                                    <div class="tab-context-menu-item" data-action="refresh">
                                        <i class="fas fa-redo"></i>
                                        刷新容器
                                    </div>

                                    <div class="tab-context-menu-divider"></div>
                                    <div class="tab-context-menu-item" data-action="close">
                                        <i class="fas fa-times"></i>
                                        关闭容器
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <iframe 
                        src="${tab.url}" 
                        class="tab-iframe"
                        sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
                        referrerpolicy="no-referrer"
                        allow="clipboard-read; clipboard-write"
                    ></iframe>
                `;
                
                // 添加到对应的容器
                const container = document.getElementById(`tabsContainer${tab.containerPage}`);
                if (container) {
                    container.appendChild(frame);
                }
                
                // 设置事件监听
                const menuBtn = frame.querySelector('.tab-menu-btn');
                const menu = frame.querySelector('.tab-context-menu');
                const tabHeader = frame.querySelector('.tab-header');
                
                // 为容器标题栏添加滑动监听（切换页面）
                this.addSwipeListeners(tabHeader);
                
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.toggleTabMenu(tab.id);
                });
                
                menu.addEventListener('click', (e) => {
                    const menuItem = e.target.closest('.tab-context-menu-item');
                    if (menuItem && menuItem.dataset.action) {
                        this.handleTabMenuAction(tab.id, menuItem.dataset.action);
                        this.closeAllTabMenus();
                    }
                });
                
                // iframe加载事件
                const iframe = frame.querySelector('iframe');
                iframe.addEventListener('load', () => {
                    this.handleIframeLoad(tab.id, iframe);
                });
                
                // 如果有关联账号，缓存数据
                if (tab.accountId) {
                    const account = this.accountManager.getAccount(tab.accountId);
                    if (account) {
                        this.accountDataCache[tab.id] = {
                            hex: account.hexContent,
                            fileName: account.fileName,
                            tabId: tab.id
                        };
                        console.log(`[MultiTabBrowser] 缓存账号数据: ${account.fileName} -> ${tab.id}`);
                    }
                }
                
                tab.frameElement = frame;
                return frame;
            }
            
            // 切换标签页菜单
            toggleTabMenu(tabId) {
                const tab = this.tabs.find(t => t.id === tabId);
                if (!tab || !tab.frameElement) return;
                
                const menu = tab.frameElement.querySelector('.tab-context-menu');
                const menuBtn = tab.frameElement.querySelector('.tab-menu-btn');
                
                if (this.activeMenuTabId === tabId) {
                    menu.classList.remove('active');
                    menuBtn.classList.remove('active');
                    this.activeMenuTabId = null;
                } else {
                    this.closeAllTabMenus();
                    menu.classList.add('active');
                    menuBtn.classList.add('active');
                    this.activeMenuTabId = tabId;
                }
            }
            
            // 关闭所有标签页菜单
            closeAllTabMenus() {
                this.tabs.forEach(tab => {
                    if (tab.frameElement) {
                        const menu = tab.frameElement.querySelector('.tab-context-menu');
                        const menuBtn = tab.frameElement.querySelector('.tab-menu-btn');
                        if (menu) menu.classList.remove('active');
                        if (menuBtn) menuBtn.classList.remove('active');
                    }
                });
                this.activeMenuTabId = null;
            }
            
            // 处理标签页菜单操作
            handleTabMenuAction(tabId, action) {
                const tab = this.tabs.find(t => t.id === tabId);
                if (!tab) return;
                
                switch (action) {
                    case 'activate':
                        this.activateTab(tabId);
                        break;
                    case 'refresh':
                        if (tab.frameElement) {
                            const iframe = tab.frameElement.querySelector('iframe');
                            if (iframe) iframe.src = iframe.src;
                        }
                        break;

                    case 'close':
                        if (tab.accountId) {
                            this.closeAccountContainer(tab.accountId);
                        } else {
                            this.closeTab(tabId);
                        }
                        break;
                }
            }
            
            // 激活标签页
            activateTab(tabId) {
                const tab = this.tabs.find(t => t.id === tabId);
                if (!tab) return;
                
                // 停用同一页面内的所有标签页
                const pageTabs = this.tabs.filter(t => t.containerPage === tab.containerPage);
                pageTabs.forEach(t => {
                    t.active = false;
                    if (t.frameElement) {
                        t.frameElement.classList.remove('active');
                    }
                });
                
                // 激活指定标签页
                tab.active = true;
                if (tab.frameElement) {
                    tab.frameElement.classList.add('active');
                }
                
                this.activeTabId = tabId;
                this.saveTabsToStorage();
            }
            
            // 关闭标签页
            closeTab(tabId) {
                const tabIndex = this.tabs.findIndex(t => t.id === tabId);
                if (tabIndex === -1) return;
                
                const tab = this.tabs[tabIndex];
                const containerPage = tab.containerPage;
                
                // 清理账号关联
                if (tab.accountId) {
                    const account = this.accountManager.getAccount(tab.accountId);
                    if (account) {
                        account.containerPage = null;
                        account.containerId = null;
                        this.accountManager.saveAccounts();
                        this.updateAccountCardStatus(account.id);
                        
                        // 清理缓存
                        delete this.accountDataCache[tabId];
                        console.log(`[MultiTabBrowser] 清理账号数据缓存: ${tabId}`);
                    }
                }
                
                // 移除DOM元素
                if (tab.frameElement) {
                    tab.frameElement.remove();
                }
                
                // 从数组中移除
                this.tabs.splice(tabIndex, 1);
                
                // 如果关闭的是当前激活的标签页，激活同一页面的另一个标签页
                if (this.activeTabId === tabId) {
                    const pageTabs = this.tabs.filter(t => t.containerPage === containerPage);
                    if (pageTabs.length > 0) {
                        this.activateTab(pageTabs[0].id);
                    } else {
                        this.activeTabId = null;
                    }
                }
                
                this.updateContainerBadges();
                this.updateNextContainerPage();
                this.saveTabsToStorage();
            }
            
            // 更新下一个可用容器页面
            updateNextContainerPage() {
                for (let page = 1; page <= 3; page++) {
                    const tabsInPage = this.tabs.filter(tab => tab.containerPage === page);
                    if (tabsInPage.length === 0) {
                        this.nextContainerPage = page;
                        return;
                    }
                }
                this.nextContainerPage = 1;
            }
            
            // iframe加载处理
            handleIframeLoad(tabId, iframe) {
                const tab = this.tabs.find(t => t.id === tabId);
                if (!tab) return;
                
                console.log(`[MultiTabBrowser] iframe加载完成，立即注入登录脚本: ${tab.title}`);
                // 采用激进策略，iframe加载完成后立即注入登录脚本
                this.injectLoginBinScript(tab, iframe);
            }
            
            // 更新标签页标题
            updateTabTitle(tabId, title) {
                const tab = this.tabs.find(t => t.id === tabId);
                if (!tab) return;
                
                tab.title = title;
                
                if (tab.frameElement) {
                    const titleEl = tab.frameElement.querySelector('.tab-header-title');
                    if (titleEl) titleEl.textContent = title;
                }
                
                this.saveTabsToStorage();
            }
            
            // 注入登录脚本，使用外部文件
            injectLoginBinScript(tab, iframe, retryCount = 0) {
                try {
                    if (!iframe.contentWindow || !iframe.contentWindow.document) {
                        console.error('[MultiTabBrowser] iframe不可访问，登录脚本注入失败');
                        return;
                    }
                    
                    const account = tab.accountId ? this.accountManager.getAccount(tab.accountId) : null;
                    
                    if (account && account.hexContent) {
                        console.log(`[MultiTabBrowser] 注入账号数据到iframe: ${account.fileName}，重试次数: ${retryCount}`);
                        
                        // 立即缓存账号数据，确保刷新后仍然可用
                        this.accountDataCache[tab.id] = {
                            hex: account.hexContent,
                            fileName: account.fileName,
                            tabId: tab.id
                        };
                        
                        // 清除旧的账号数据
                        const clearScript = iframe.contentWindow.document.createElement('script');
                        clearScript.textContent = `
                            // 清除旧的账号数据
                            delete window.__accountDataFromParent;
                            delete window.__binHex;
                            delete window.__accountJson;
                            console.log('[MultiTabBrowser] 已清除旧的账号数据');
                        `;
                        iframe.contentWindow.document.head.appendChild(clearScript);
                        
                        // 立即注入账号数据，不延迟
                        const dataScript = iframe.contentWindow.document.createElement('script');
                        dataScript.textContent = `
                            // 账号数据注入
                            window.__accountDataFromParent = ${JSON.stringify({
                                hex: account.hexContent,
                                fileName: account.fileName,
                                tabId: tab.id
                            })};
                            window.__binHex = '${account.hexContent}';
                            console.log('[MultiTabBrowser] 账号数据已注入到iframe:', '${account.fileName}');
                        `;
                        iframe.contentWindow.document.head.appendChild(dataScript);
                        
                        // 直接注入登录脚本，不使用外部文件，确保刷新后能正常工作
                        const loginScript = iframe.contentWindow.document.createElement('script');
                        loginScript.textContent = `
                            // 直接注入登录脚本，确保刷新后能正常工作
                            ;(function() {
                                function ready() {
                                    if (typeof window.__require !== 'function') return false;
                                    try { var ok13 = !!window.__require('13'); } catch(_) { ok13 = false; }
                                    try { var okDI = !!window.__require('data-index'); } catch(_) { okDI = false; }
                                    return ok13 && okDI;
                                }
                                
                                function waitModules(fn, attempt = 0) {
                                    if (ready()) {
                                        try { fn(); } catch(e) { console.error('[LoginBinFile] init error', e); }
                                        return;
                                    }
                                    
                                    console.log('[LoginBinFile] waiting for modules... attempt:', attempt);
                                    
                                    if (attempt > 300) {
                                        console.warn('[LoginBinFile] timeout waiting for modules, retrying...');
                                        // 重置尝试次数，继续重试
                                        attempt = 0;
                                    }
                                    
                                    setTimeout(() => {
                                        waitModules(fn, attempt + 1);
                                    }, 200);
                                }
                                
                                window.__applyLoginInterceptor = function() {
                                    try {
                                        var di = window.__require('data-index');
                                        var LS = di && di.LoginService;
                                        
                                        var hex = window.__binHex || window.__accountDataFromParent?.hex || null;
                                        if (!hex) {
                                            console.warn('[LoginBinFile] no bin payload');
                                            return;
                                        }
                                        
                                        console.log('[LoginBinFile] applying login interceptor...');
                                        
                                        var dm = window.__require('13');
                                        if (!dm) {
                                            console.warn('[LoginBinFile] dm missing');
                                            return;
                                        }
                                        
                                        function hexToUint8Array(hex) {
                                            try {
                                                var parts = (hex || '').match(/.{1,2}/g);
                                                if (!parts) return null;
                                                var arr = new Uint8Array(parts.length);
                                                for (var i=0; i<parts.length; i++) {
                                                    arr[i] = parseInt(parts[i], 16);
                                                }
                                                return arr;
                                            } catch(e) {
                                                console.error('[LoginBinFile] hex decode error', e);
                                                return null;
                                            }
                                        }
                                        
                                        var bytes = hexToUint8Array(hex);
                                        if (!bytes) {
                                            console.warn('[LoginBinFile] bytes empty');
                                            return;
                                        }
                                        
                                        var d = dm.decMsg(bytes.buffer, { decrypt: dm.lz4XorDecode, encrypt: dm.lz4XorEncode });
                                        
                                        var payload, pe = 'mix', infoStr = null, sid = null;
                                        if (d && d._raw && d._raw.info) {
                                            payload = d._raw;
                                            pe = payload.platformExt || 'mix';
                                            infoStr = payload.info;
                                            sid = payload.serverId || null;
                                            console.log('[LoginBinFile] serverId=' + sid);
                                        } else {
                                            infoStr = JSON.stringify(d);
                                            payload = { platform:'hortor', platformExt:'mix', info: infoStr, serverId: null, scene:0, referrerInfo:'', rtt:0 };
                                        }
                                        
                                        if (LS && LS.authUser && !LS.authUser.isSelfCreate) {
                                            var origAuth = LS.authUser;
                                            var firstLogin = true;
                                            LS.authUser = function(p) {
                                                var t = Object.assign({}, p);
                                                t.platformExt = pe;
                                                t.info = infoStr;
                                                if (firstLogin) {
                                                    firstLogin = false;
                                                    if (sid) { t.serverId = sid; }
                                                }
                                                return origAuth(t);
                                            };
                                            LS.authUser.isSelfCreate = true;
                                            console.log('[LoginBinFile] patched LS.authUser');
                                        }
                                        
                                        if (LS && LS.serverList && !LS.serverList.isSelfCreate) {
                                            var origSL = LS.serverList;
                                            LS.serverList = function() {
                                                if (payload && payload.info) {
                                                    return origSL(payload);
                                                }
                                                var pay = { platform:'hortor', platformExt: pe, info: infoStr, serverId: sid, scene:0, referrerInfo:'', rtt:0 };
                                                return origSL(pay);
                                            };
                                            LS.serverList.isSelfCreate = true;
                                            console.log('[LoginBinFile] patched LS.serverList');
                                        }
                                        
                                        if (di && di.Isolate && !di.Isolate.isSelfCreate) {
                                            var OrigIso = di.Isolate;
                                            di.Isolate = function() {
                                                var inst = new OrigIso(...arguments);
                                                if (inst.LoginService && inst.LoginService.authUser && !inst.LoginService.authUser.isSelfCreate) {
                                                    var aorig = inst.LoginService.authUser;
                                                    inst.LoginService.authUser = function(p) {
                                                        var t = Object.assign({}, p);
                                                        t.platformExt = pe;
                                                        t.info = infoStr;
                                                        if (sid) { t.serverId = sid; }
                                                        return aorig(t);
                                                    };
                                                    inst.LoginService.authUser.isSelfCreate = true;
                                                }
                                                return inst;
                                            };
                                            di.Isolate.isSelfCreate = true;
                                            console.log('[LoginBinFile] patched di.Isolate');
                                        }
                                        
                                        console.log('[LoginBinFile] login interceptor applied successfully');
                                        
                                        // 修改页面标题
                                        try {
                                            var accountFileName = window.__accountDataFromParent?.fileName || 'unknown';
                                            var displayName = accountFileName;
                                            if (displayName.endsWith('.bin')) {
                                                displayName = displayName.slice(0, -4);
                                            }
                                            var originalTitle = document.title;
                                            if (!originalTitle.includes('【')) {
                                                document.title = '【' + displayName + '】' + originalTitle;
                                            }
                                            console.log('[LoginBinFile] page title updated');
                                        } catch(e) {
                                            console.warn('[LoginBinFile] update title error:', e);
                                        }
                                        
                                    } catch(e) {
                                        console.error('[LoginBinFile] apply error', e);
                                        // 重试应用登录拦截器
                                        setTimeout(() => {
                                            window.__applyLoginInterceptor();
                                        }, 1000);
                                    }
                                };
                                
                                // 立即尝试应用登录拦截器
                                window.__applyLoginInterceptor();
                                
                                // 同时等待模块就绪后再次应用登录拦截器，确保万无一失
                                waitModules(function() {
                                    console.log('[LoginBinFile] modules ready, applying login interceptor...');
                                    window.__applyLoginInterceptor();
                                });
                            })();
                        `;
                        iframe.contentWindow.document.head.appendChild(loginScript);
                        
                        console.log('[MultiTabBrowser] 登录脚本已直接注入到iframe，账号:', account.fileName, '重试次数:', retryCount);
                    } else {
                        // 没有账号数据，直接加载外部登录脚本
                        try {
                            const readyScript = iframe.contentWindow.document.createElement('script');
                            readyScript.src = 'xyzw.ready.js';
                            readyScript.onload = () => {
                                const loginScript = iframe.contentWindow.document.createElement('script');
                                loginScript.src = 'xyzw.login.bin.js';
                                iframe.contentWindow.document.head.appendChild(loginScript);
                                console.log('[MultiTabBrowser] 注入通用登录脚本（无账号数据）');
                            };
                            iframe.contentWindow.document.head.appendChild(readyScript);
                        } catch (err) {
                            console.error('[MultiTabBrowser] 注入通用登录脚本失败:', err);
                        }
                    }
                    
                    // 注入插件
                    setTimeout(() => {
                        this.pluginManager.injectToIframe(iframe.contentWindow);
                    }, 1000);
                    
                } catch (error) {
                    console.error('[MultiTabBrowser] 注入脚本失败，重试次数:', retryCount, error);
                    // 如果注入失败，重试一次
                    if (retryCount < 5) {
                        setTimeout(() => {
                            this.injectLoginBinScript(tab, iframe, retryCount + 1);
                        }, 3000);
                    }
                }
            }
            
            // 加载账号
            loadAccounts() {
                const accounts = this.accountManager.loadAccounts();
                if (accounts.length > 0) {
                    accounts.forEach(account => this.createAccountCard(account));
                    this.hideAccountEmptyState();
                } else {
                    this.showAccountEmptyState();
                }
            }
            
            // 显示/隐藏账号空状态
            showAccountEmptyState() {
                if (this.elements.accountEmptyState) {
                    this.elements.accountEmptyState.style.display = 'flex';
                }
            }
            
            hideAccountEmptyState() {
                if (this.elements.accountEmptyState) {
                    this.elements.accountEmptyState.style.display = 'none';
                }
            }
            
            // 编辑账号
            editAccount(accountId) {
                const account = this.accountManager.getAccount(accountId);
                if (account) {
                    const newName = prompt('请输入新的账号名称:', account.fileName);
                    if (newName && newName.trim() !== '') {
                        account.fileName = newName.trim();
                        this.accountManager.saveAccounts();
                        
                        if (account.cardElement) {
                            const filenameEl = account.cardElement.querySelector('.account-card-filename');
                            if (filenameEl) {
                                filenameEl.innerHTML = `<i class="fas fa-file-alt"></i> ${this.escapeHtml(account.fileName)}`;
                                filenameEl.title = account.fileName;
                            }
                        }
                        
                        if (account.containerId) {
                            const tab = this.tabs.find(t => t.id === account.containerId);
                            if (tab) {
                                tab.title = account.fileName.replace('.bin', '');
                                this.updateTabTitle(tab.id, tab.title);
                            }
                        }
                    }
                }
            }
            
            // 删除账号
            deleteAccount(accountId) {
                if (!confirm('确定要删除这个账号吗？此操作不可撤销！')) return;
                
                const account = this.accountManager.getAccount(accountId);
                if (account) {
                    if (account.containerId) this.closeAccountContainer(accountId);
                    this.accountManager.removeAccount(accountId);
                    if (account.cardElement) account.cardElement.remove();
                    if (this.accountManager.accounts.length === 0) this.showAccountEmptyState();
                    this.updateContainerBadges();
                }
            }
            
            // 保存标签页数据
            saveTabsToStorage() {
                try {
                    const data = {
                        tabs: this.tabs.map(tab => ({
                            id: tab.id,
                            title: tab.title,
                            url: tab.url,
                            created: tab.created.getTime(),
                            active: tab.active,
                            accountId: tab.accountId,
                            containerPage: tab.containerPage,
                            accountData: tab.accountData
                        })),
                        activeTabId: this.activeTabId,
                        tabCounter: this.tabCounter,
                        currentPageIndex: this.currentPageIndex,
                        nextContainerPage: this.nextContainerPage
                    };
                    
                    localStorage.setItem('multitab-data', JSON.stringify(data));
                } catch (e) {
                    console.error('[MultiTabBrowser] 保存失败:', e);
                }
            }
            
            // 加载标签页数据
            loadTabsFromStorage() {
                try {
                    const dataStr = localStorage.getItem('multitab-data');
                    if (!dataStr) return;
                    
                    const data = JSON.parse(dataStr);
                    
                    // 过滤掉无效的标签页（账号不存在的）
                    const validTabs = [];
                    
                    data.tabs.forEach(tabData => {
                        // 检查账号是否仍然存在
                        if (tabData.accountId) {
                            const account = this.accountManager.getAccount(tabData.accountId);
                            if (!account) {
                                console.warn('[MultiTabBrowser] 跳过无效标签页，账号不存在:', tabData.accountId);
                                return; // 跳过该标签页
                            }
                        }
                        
                        const tab = {
                            id: tabData.id,
                            title: tabData.title,
                            url: tabData.url,
                            created: new Date(tabData.created),
                            active: tabData.active,
                            accountId: tabData.accountId || null,
                            containerPage: tabData.containerPage || 1,
                            accountData: tabData.accountData || null,
                            frameElement: null
                        };
                        
                        validTabs.push(tab);
                        this.tabs.push(tab);
                        this.createFrameElement(tab);
                    });
                    
                    // 如果有标签页被过滤掉，更新localStorage
                    if (validTabs.length !== data.tabs.length) {
                        console.log('[MultiTabBrowser] 移除了', data.tabs.length - validTabs.length, '个无效标签页');
                        data.tabs = validTabs;
                        localStorage.setItem('multitab-data', JSON.stringify(data));
                    }
                    
                    this.tabCounter = data.tabCounter || this.tabs.length;
                    this.currentPageIndex = data.currentPageIndex || 0;
                    this.nextContainerPage = data.nextContainerPage || 1;
                    
                    // 激活标签页
                    if (data.activeTabId && this.tabs.length > 0) {
                        this.activateTab(data.activeTabId);
                    } else if (this.tabs.length > 0) {
                        this.activateTab(this.tabs[0].id);
                    }
                    
                    // 更新容器徽章
                    this.updateContainerBadges();
                    
                    // 切换到保存的页面
                    this.switchToPage(this.currentPageIndex);
                    
                } catch (e) {
                    console.error('[MultiTabBrowser] 加载失败:', e);
                }
            }
            
            // 插件管理方法
            showPluginManager() {
                this.renderPluginList();
                this.elements.pluginManagerPanel.classList.add('active');
                this.elements.pluginPanelOverlay.classList.add('active');
            }
            
            hidePluginManager() {
                this.elements.pluginManagerPanel.classList.remove('active');
                this.elements.pluginPanelOverlay.classList.remove('active');
            }
            
            importPlugin() {
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = '.js,.txt,.json,.text';
                fileInput.multiple = true;
                fileInput.style.display = 'none';
                
                fileInput.onchange = (e) => {
                    const files = Array.from(e.target.files);
                    files.forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const pluginName = file.name.replace(/\.[^/.]+$/, "");
                            const code = event.target.result;
                            
                            this.pluginManager.addPlugin(pluginName, code, true);
                            this.renderPluginList();
                            alert(`插件 "${pluginName}" 导入成功！`);
                        };
                        reader.readAsText(file);
                    });
                };
                
                document.body.appendChild(fileInput);
                fileInput.click();
                setTimeout(() => document.body.removeChild(fileInput), 100);
            }
            
            createPlugin() {
                const name = prompt('请输入插件名称:', '新插件');
                if (!name) return;
                
                const code = prompt('请输入插件代码 (JavaScript):', 
                    `// 插件: ${name}\nconsole.log("插件 ${name} 已加载");\n// 在这里编写你的插件代码`);
                if (!code) return;
                
                this.pluginManager.addPlugin(name, code, true);
                this.renderPluginList();
                alert(`插件 "${name}" 创建成功！`);
            }
            
            refreshPlugins() {
                alert('所有插件已重新注入到运行中的容器');
            }
            
            renderPluginList() {
                const container = document.getElementById('pluginListContainer');
                const emptyState = document.getElementById('pluginEmptyState');
                
                const plugins = this.pluginManager.plugins;
                
                if (plugins.length === 0) {
                    container.innerHTML = '';
                    emptyState.style.display = 'block';
                    return;
                }
                
                emptyState.style.display = 'none';
                container.innerHTML = plugins.map(plugin => `
                    <div class="plugin-item" data-plugin-id="${plugin.id}">
                        <div class="plugin-item-header">
                            <div class="plugin-item-name">${this.escapeHtml(plugin.name)}</div>
                            <div class="plugin-item-status ${plugin.enabled ? 'active' : ''}">
                                ${plugin.enabled ? '启用' : '禁用'}
                            </div>
                        </div>
                        <div class="plugin-item-actions">
                            <button class="plugin-item-btn" title="${plugin.enabled ? '禁用' : '启用'}" onclick="window.browser.togglePlugin('${plugin.id}')">
                                <i class="fas fa-power-off"></i>
                            </button>
                            <button class="plugin-item-btn" title="编辑" onclick="window.browser.editPlugin('${plugin.id}')">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="plugin-item-btn" title="删除" onclick="window.browser.deletePlugin('${plugin.id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }
            
            togglePlugin(pluginId) {
                const plugin = this.pluginManager.getPlugin(pluginId);
                if (plugin) {
                    plugin.enabled = !plugin.enabled;
                    plugin.updatedAt = new Date().toISOString();
                    this.pluginManager.savePlugins();
                    this.renderPluginList();
                }
            }
            
            editPlugin(pluginId) {
                const plugin = this.pluginManager.getPlugin(pluginId);
                if (plugin) {
                    const newName = prompt('请输入新的插件名称:', plugin.name);
                    if (newName) {
                        plugin.name = newName;
                        
                        const newCode = prompt('请输入新的插件代码:', plugin.code);
                        if (newCode !== null) {
                            plugin.code = newCode;
                            plugin.enabled = confirm('是否启用此插件？');
                            plugin.updatedAt = new Date().toISOString();
                            
                            this.pluginManager.savePlugins();
                            this.renderPluginList();
                        }
                    }
                }
            }
            
            deletePlugin(pluginId) {
                const plugin = this.pluginManager.getPlugin(pluginId);
                if (plugin && confirm(`确定要删除插件 "${plugin.name}" 吗？`)) {
                    this.pluginManager.removePlugin(pluginId);
                    this.renderPluginList();
                }
            }
            
            // 工具方法
            formatDate(date) {
                if (!date) return '-';
                try {
                    const d = new Date(date);
                    const now = new Date();
                    const diffMs = now - d;
                    const diffMins = Math.floor(diffMs / 60000);
                    const diffHours = Math.floor(diffMs / 3600000);
                    const diffDays = Math.floor(diffMs / 86400000);
                    
                    if (diffMins < 1) return '刚刚';
                    else if (diffMins < 60) return `${diffMins}分钟前`;
                    else if (diffHours < 24) return `${diffHours}小时前`;
                    else if (diffDays < 7) return `${diffDays}天前`;
                    else return d.toLocaleDateString('zh-CN', {
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                } catch (e) {
                    return date.toString();
                }
            }
            
            formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[MultiTabBrowser] DOM已加载，初始化MultiTabBrowser...');
            window.browser = new MultiTabBrowser();
            window.__accountDataCache = window.browser.accountDataCache; // 暴露给iframe访问
            console.log('[MultiTabBrowser] MultiTabBrowser初始化完成');
        });
    </script>
</body>
</html>
