<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>H - 多账号管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            position: fixed;
        }

        body {
            background: #f5f5f5;
            color: #333333;
            overscroll-behavior: none;
        }

        :root {
            --primary-color: #1976D2;
            --accent-color: #FF4081;
            --success-color: #4CAF50;
            --error-color: #F44336;
            --background-color: #FAFAFA;
            --surface-color: #FFFFFF;
            --text-primary: #212121;
            --text-secondary: #757575;
            --divider-color: #E0E0E0;
            --shadow-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --shadow-2: 0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23);
            --shadow-3: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
        }

        /* 页面容器 - 横向flex布局 */
        .page-container {
            display: flex;
            flex-direction: row;
            width: 400vw; /* 4个页面：100vw * 4 */
            height: 100vh;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            will-change: transform;
            transform: translateX(0);
            position: relative;
            -webkit-overflow-scrolling: touch;
        }

        /* 每个页面占满一个屏幕宽度 */
        .page {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--surface-color);
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        /* 控制面板页面 */
        .function-page {
            background: var(--surface-color);
        }

        /* 容器页面 - 没有标题栏，全屏显示容器 */
        .container-page {
            background: var(--background-color);
            position: relative;
            padding: 0;
        }

        /* 控制面板页面标题栏 */
        .page-title-bar {
            height: 60px;
            background: var(--surface-color);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-1);
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            cursor: grab;
            touch-action: pan-y;
            z-index: 100;
            flex-shrink: 0;
        }

        .page-title-bar:active {
            cursor: grabbing;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            transition: transform 0.15s ease;
            position: relative;
        }

        /* 页面内容区域 */
        .page-content {
            flex: 1;
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        /* 控制面板页面内容 */
        .function-page .page-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        /* 顶部按钮框 */
        .top-buttons-container {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: var(--shadow-1);
            border: 1px solid var(--divider-color);
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* 功能按钮 */
        .function-btn {
            background: var(--surface-color);
            border: 1px solid var(--divider-color);
            border-radius: 8px;
            padding: 12px 20px;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            min-height: 70px;
            min-width: 100px;
            max-width: 140px;
            flex: 1;
            text-align: center;
        }

        .function-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-2);
            border-color: var(--primary-color);
            background-color: rgba(25, 118, 210, 0.08);
        }

        .function-btn:active {
            transform: translateY(0);
            box-shadow: var(--shadow-1);
        }

        .function-btn-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            line-height: 1.4;
            margin-top: 8px;
        }

        .function-btn-icon {
            font-size: 20px;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        /* 账号卡片框 */
        .account-cards-container {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow-1);
            border: 1px solid var(--divider-color);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .account-cards-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--divider-color);
        }

        .account-cards-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }

        /* 账号列表 */
        .account-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .account-card {
            background: var(--surface-color);
            border: 1px solid var(--divider-color);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-1);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
        }

        .account-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-2);
            border-color: var(--primary-color);
        }

        .account-card:after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 10px;
            background: transparent;
            transition: background 0.15s ease;
        }

        .account-card:hover:after {
            background: rgba(25, 118, 210, 0.04);
        }

        .account-card:active:after {
            background: rgba(25, 118, 210, 0.08);
        }

        .account-card-header {
            background: var(--surface-color);
            padding: 12px 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 44px;
            border-bottom: 1px solid var(--divider-color);
        }

        .account-card-filename {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .account-card-filename i {
            font-size: 14px;
            opacity: 0.9;
        }

        .account-card-controls {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .account-card-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            background: var(--background-color);
            color: var(--text-secondary);
        }

        .account-card-status.active {
            background: rgba(76, 175, 80, 0.15);
            color: var(--success-color);
            font-weight: 500;
        }

        .account-card-status.inactive {
            background: rgba(158, 158, 158, 0.15);
            color: var(--text-secondary);
        }

        .account-card-footer {
            padding: 10px 16px;
            background: var(--background-color);
            border-top: 1px solid var(--divider-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 44px;
        }

        .account-card-time {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .account-card-time i {
            font-size: 10px;
        }

        /* ==================== 容器页面样式 ==================== */
        .tabs-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .tab-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--surface-color);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .tab-frame.active {
            display: flex;
            z-index: 10;
        }

        /* 容器标题栏 - 可以滑动切换页面 */
        .tab-header {
            background: var(--surface-color);
            color: var(--text-primary);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            border-bottom: 1px solid var(--divider-color);
            flex-shrink: 0;
            min-height: 36px;
            cursor: grab;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }

        .tab-header:active {
            cursor: grabbing;
        }

        .tab-header-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 8px;
            font-weight: 500;
            font-size: 11px;
        }
        
        .tab-header-controls {
            display: flex;
            gap: 4px;
        }
        
        /* iframe填满容器 */
        .tab-iframe {
            width: 100%;
            height: 100%;
            flex: 1;
            border: none;
            background: var(--surface-color);
            display: block;
        }
        
        /* 容器菜单按钮样式 */
        .tab-header-menu {
            position: relative;
        }
        
        .tab-menu-btn {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            background: var(--background-color);
            border: 1px solid var(--divider-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: all 0.15s ease;
        }

        .tab-menu-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: var(--shadow-2);
        }

        .tab-menu-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 容器菜单 */
        .tab-context-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--surface-color);
            border: 1px solid var(--divider-color);
            border-radius: 12px;
            box-shadow: var(--shadow-3);
            z-index: 1000;
            min-width: 180px;
            overflow: hidden;
            display: none;
        }

        .tab-context-menu.active {
            display: block;
        }

        .tab-context-menu-item {
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--divider-color);
        }

        .tab-context-menu-item:last-child {
            border-bottom: none;
        }

        .tab-context-menu-item:hover {
            background: var(--primary-color);
            color: white;
        }

        .tab-context-menu-divider {
            height: 1px;
            background: var(--divider-color);
            margin: 6px 0;
        }

        /* 空状态 */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-secondary);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 350px;
            padding: 20px;
            z-index: 10;
        }

        .empty-state.active {
            display: flex;
        }

        .empty-state h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* 容器页面返回按钮 - 修改后的样式 */
        .container-back-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--divider-color);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            z-index: 100;
            box-shadow: var(--shadow-2);
            transition: all 0.3s ease;
            opacity: 0.8;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .container-back-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateX(-50%) scale(1.1);
            opacity: 1;
            box-shadow: var(--shadow-3);
        }

        .container-back-btn.hidden {
            display: none;
        }

        /* 账号操作面板 */
        .account-action-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 320px;
            max-width: 90vw;
            max-height: 80vh;
            background: var(--surface-color);
            border-radius: 16px;
            box-shadow: var(--shadow-3);
            z-index: 100000;
            display: none;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transition: all 0.15s ease;
        }

        .account-action-panel.active {
            display: flex;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .action-panel-content {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .action-panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--divider-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-panel-header h3 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            color: var(--text-primary);
        }

        .action-panel-close {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--background-color);
            border: 1px solid var(--divider-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.15s ease;
        }

        .action-panel-close:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: rotate(90deg);
        }

        .action-panel-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .action-btn {
            background: var(--surface-color);
            border: 1px solid var(--divider-color);
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            width: 100%;
            display: block;
        }

        .action-btn:hover {
            background: rgba(0, 0, 0, 0.04);
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-1);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99999;
            display: none;
            animation: fadeIn 0.15s ease;
        }

        .action-panel-overlay.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 插件管理面板 */
        .plugin-manager-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 600px;
            max-width: 90vw;
            max-height: 80vh;
            background: var(--surface-color);
            border-radius: 16px;
            box-shadow: var(--shadow-3);
            z-index: 100001;
            display: none;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transition: all 0.15s ease;
        }

        .plugin-manager-panel.active {
            display: flex;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .plugin-panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--divider-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .plugin-panel-header h3 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .plugin-panel-close {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--background-color);
            border: 1px solid var(--divider-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.15s ease;
        }

        .plugin-panel-close:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: rotate(90deg);
        }

        .plugin-panel-body {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .plugin-panel-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .plugin-action-btn {
            flex: 1;
            padding: 12px 16px;
            background: var(--surface-color);
            border: 1px solid var(--divider-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }

        .plugin-action-btn:hover {
            background: rgba(25, 118, 210, 0.08);
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-1);
        }

        .plugin-list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
            padding: 4px;
        }

        .plugin-item {
            background: var(--surface-color);
            border: 1px solid var(--divider-color);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.15s ease;
        }

        .plugin-item:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-1);
        }

        .plugin-item-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .plugin-item-name {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 14px;
        }

        .plugin-item-status {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            background: var(--background-color);
            color: var(--text-secondary);
        }

        .plugin-item-status.active {
            background: rgba(76, 175, 80, 0.15);
            color: var(--success-color);
        }

        .plugin-item-actions {
            display: flex;
            gap: 6px;
        }

        .plugin-item-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--background-color);
            border: 1px solid var(--divider-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.15s ease;
        }

        .plugin-item-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .plugin-empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 20px;
        }

        .plugin-empty-state h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .page-title-bar {
                height: 48px;
            }
            
            .function-btn {
                padding: 10px 15px;
                min-height: 60px;
                min-width: 80px;
            }
            
            .function-btn-title {
                font-size: 12px;
            }
            
            .function-btn-icon {
                font-size: 16px;
            }
            
            .page-title {
                font-size: 18px;
            }
            
            .account-card-header {
                padding: 10px 12px;
            }
            
            .account-card-footer {
                padding: 8px 12px;
            }
            
            .plugin-manager-panel {
                width: 95vw;
            }
            
            .plugin-panel-actions {
                flex-direction: column;
            }
            
            .tab-context-menu {
                min-width: 160px;
                right: -10px;
            }
            
            .top-buttons-container {
                padding: 10px 15px;
                gap: 10px;
            }
            
            .account-cards-container {
                padding: 15px;
            }
            

        }

        @media (max-width: 576px) {
            .page-content {
                padding: 15px;
                gap: 15px;
            }
            
            .function-btn {
                padding: 8px 12px;
                min-height: 55px;
                min-width: 70px;
            }
            
            .function-btn-title {
                font-size: 11px;
            }
            
            .function-btn-icon {
                font-size: 14px;
            }
            
            .page-title {
                font-size: 16px;
            }
            
            .account-card {
                border-radius: 8px;
            }
            
            .account-card-header {
                padding: 8px 12px;
            }
            
            .account-card-filename {

        // 整合xyzw.login.bin.js和xyzw.ready.js的登录脚本
        const LOGIN_BIN_JS = `;(function(){

  
  // 模块就绪检测
  function modulesReady() {
    if (typeof window.__require !== 'function') return false
    try{ var ok13 = !!window.__require('13') }catch(_){ ok13 = false }
    try{ var okDI = !!window.__require('data-index') }catch(_){ okDI = false }
    return ok13 && okDI
  }
  
  // 模块就绪等待函数
  function waitModules(fn) {
    if (modulesReady()) { 
      try { fn() } catch(e) { console.error('[MultiTabLogin] modules init error', e) } 
      return 
    }
    console.log('[MultiTabLogin] waiting for modules...');
    var tries = 0
    var t = setInterval(function(){
      if (modulesReady()) { 
        clearInterval(t); 
        try { fn() } catch(e) { console.error('[MultiTabLogin] modules init error', e) } 
      }
      else { 
        tries++; 
        if (tries > 200) { 
          clearInterval(t);
          console.warn('[MultiTabLogin] timeout waiting for modules');
        }
      }
    }, 100) // 提高检查频率到100ms
  }
  
  // 主登录功能实现
  function initLogin() {
    console.log('[MultiTabLogin] initLogin start');
    
    try {
      var dm = window.__require('13');
      if (!dm) { 
        console.warn('[MultiTabLogin] dm module missing');
        return;
      }
      
      // 十六进制转Uint8Array
      function hexToUint8Array(hex) {
        try {
          var parts = (hex || '').match(/.{1,2}/g);
          if (!parts) return null;
          var arr = new Uint8Array(parts.length);
          for (var i=0; i<parts.length; i++) {
            arr[i] = parseInt(parts[i], 16);
          }
          return arr;
        } catch(e) {
          console.error('[MultiTabLogin] hex decode error', e);
          return null;
        }
      }
      
      // 应用登录拦截器，增加重试机制
      function applyLoginInterceptor(attempt = 0) {
        try {
          console.log('[MultiTabLogin] applyLoginInterceptor attempt:', attempt);
          
          var di = window.__require('data-index');
          var LS = di && di.LoginService;
          
          if (!LS) {
            console.warn('[MultiTabLogin] LoginService not found, attempt:', attempt);
            // 重试机制：如果LoginService未找到，延迟500ms重试，最多重试3次
            if (attempt < 3) {
              setTimeout(() => {
                applyLoginInterceptor(attempt + 1);
              }, 500);
            }
            return;
          }
          
          // 获取账号数据
          var accountData = null;
          var accountFileName = 'unknown';
          
          // 方法1: 从全局变量获取
          if (window.__accountDataFromParent) {
            console.log('[MultiTabLogin] get account data from __accountDataFromParent');
            accountData = window.__accountDataFromParent;
            accountFileName = accountData.fileName || 'unknown';
          }
          
          // 方法2: 从window.name获取
          if (!accountData && window.name && window.name.startsWith('ACCOUNT_DATA:')) {
            try {
              console.log('[MultiTabLogin] get account data from window.name');
              accountData = JSON.parse(window.name.substring(13));
              accountFileName = accountData.fileName || 'unknown';
            } catch(e) {
              console.error('[MultiTabLogin] parse window.name error:', e);
            }
          }
          
          // 方法3: 从父窗口缓存获取
          if (!accountData && window.frameElement) {
            try {
              var tabId = window.frameElement.dataset.tabId;
              if (tabId && window.parent && window.parent.__accountDataCache) {
                console.log('[MultiTabLogin] get account data from parent cache, tabId:', tabId);
                accountData = window.parent.__accountDataCache[tabId];
                accountFileName = accountData.fileName || 'unknown';
              }
            } catch(e) {
              console.error('[MultiTabLogin] get account data from parent error:', e);
            }
          }
          
          if (!accountData || !accountData.hex) {
            console.warn('[MultiTabLogin] no account data or hex content');
            return;
          }
          
          console.log('[MultiTabLogin] account data found:', accountFileName);
          
          // 处理账号数据
          var hex = accountData.hex;
          var bytes = hexToUint8Array(hex);
          if (!bytes) {
            console.warn('[MultiTabLogin] invalid hex content');
            return;
          }
          
          // 解密数据
          var d = dm.decMsg(bytes.buffer, { 
            decrypt: dm.lz4XorDecode, 
            encrypt: dm.lz4XorEncode 
          });
          
          // 解析登录数据
          var payload, platformExt = 'mix', infoStr = null, serverId = null;
          
          if (d && d._raw && d._raw.info) {
            // 标准 .bin 格式
            payload = d._raw;
            platformExt = payload.platformExt || 'mix';
            infoStr = payload.info;
            serverId = payload.serverId || null;
            console.log('[MultiTabLogin] standard .bin format detected');
          } else {
            // info-object .bin 格式
            infoStr = JSON.stringify(d);
            console.log('[MultiTabLogin] info-object .bin format detected');
          }
          
          console.log('[MultiTabLogin] platformExt:', platformExt);
          console.log('[MultiTabLogin] serverId:', serverId);
          
          // 应用登录拦截
          if (LS && LS.authUser && !LS.authUser.isSelfCreate) {
            console.log('[MultiTabLogin] patch LS.authUser');
            var origAuth = LS.authUser;
            var firstLogin = true;
            
            LS.authUser = function(p) {
              var t = Object.assign({}, p);
              t.platformExt = platformExt;
              t.info = infoStr;
              if (firstLogin) {
                firstLogin = false;
                if (serverId) {
                  t.serverId = serverId;
                }
              }
              return origAuth(t);
            };
            LS.authUser.isSelfCreate = true;
          }
          
          if (LS && LS.serverList && !LS.serverList.isSelfCreate) {
            console.log('[MultiTabLogin] patch LS.serverList');
            var origSL = LS.serverList;
            LS.serverList = function() {
              var pay = { 
                platform: 'hortor', 
                platformExt: platformExt, 
                info: infoStr, 
                serverId: serverId, 
                scene: 0, 
                referrerInfo: '', 
                rtt: 0 
              };
              return origSL(pay);
            };
            LS.serverList.isSelfCreate = true;
          }
          
          if (di && di.Isolate && !di.Isolate.isSelfCreate) {
            console.log('[MultiTabLogin] patch di.Isolate');
            var OrigIso = di.Isolate;
            di.Isolate = function() {
              var inst = new OrigIso(...arguments);
              if (inst.LoginService && inst.LoginService.authUser && !inst.LoginService.authUser.isSelfCreate) {
                var aorig = inst.LoginService.authUser;
                inst.LoginService.authUser = function(p) {
                  var t = Object.assign({}, p);
                  t.platformExt = platformExt;
                  t.info = infoStr;
                  if (serverId) {
                    t.serverId = serverId;
                  }
                  return aorig(t);
                };
                inst.LoginService.authUser.isSelfCreate = true;
              }
              return inst;
            };
            di.Isolate.isSelfCreate = true;
          }
          
          console.log('[MultiTabLogin] login interceptor applied successfully, attempt:', attempt);
          
          // 修改页面标题
          try {
            var displayName = accountFileName;
            if (displayName.endsWith('.bin')) {
              displayName = displayName.slice(0, -4);
            }
            var originalTitle = document.title;
            if (!originalTitle.includes('【')) {
              document.title = '【' + displayName + '】' + originalTitle;
            }
            console.log('[MultiTabLogin] page title updated');
          } catch(e) {
            console.warn('[MultiTabLogin] update title error:', e);
          }
          
        } catch(e) {
          console.error('[MultiTabLogin] apply login interceptor error, attempt:', attempt, e);
          // 重试机制：如果发生错误，延迟500ms重试，最多重试3次
          if (attempt < 3) {
            setTimeout(() => {
              applyLoginInterceptor(attempt + 1);
            }, 500);
          }
        }
      }
      
      // 立即应用登录拦截器
      applyLoginInterceptor();
      // 暴露applyLoginInterceptor函数给全局，以便外部调用
      window.__applyLoginInterceptor = applyLoginInterceptor;
      
    } catch(e) {
      console.error('[MultiTabLogin] init error:', e);
    }
  }
  
  // 启动流程：等待模块就绪后直接初始化登录
  waitModules(function() {
    console.log('[MultiTabLogin] modules ready, initializing login...');
    initLogin();
  });
})();`;

        // ==================== 插件管理器类 ====================
        class PluginManager {
            constructor() {
                this.plugins = [];
                this.storageKey = 'multitab_plugins';
                this.loadPlugins();
            }
            
            loadPlugins() {
                try {
                    const saved = localStorage.getItem(this.storageKey);
                    if (saved) {
                        this.plugins = JSON.parse(saved);
                        console.log('[PluginManager] 加载插件:', this.plugins.length);
                    }
                } catch (e) {
                    console.error('[PluginManager] 加载插件失败:', e);
                }
            }
            
            savePlugins() {
                try {
                    const data = JSON.stringify(this.plugins);
                    localStorage.setItem(this.storageKey, data);
                    console.log('[PluginManager] 保存插件:', this.plugins.length);
                } catch (e) {
                    console.error('[PluginManager] 保存插件失败:', e);
                }
            }
            
            addPlugin(name, code, enabled = true) {
                const plugin = {
                    id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                    name: name || '未命名插件',
                    code: code,
                    enabled: enabled,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                
                this.plugins.push(plugin);
                this.savePlugins();
                console.log('[PluginManager] 添加插件:', plugin.name);
                return plugin;
            }
            
            removePlugin(pluginId) {
                this.plugins = this.plugins.filter(p => p.id !== pluginId);
                this.savePlugins();
                console.log('[PluginManager] 删除插件:', pluginId);
            }
            
            getPlugin(pluginId) {
                return this.plugins.find(p => p.id === pluginId);
            }
            
            getPluginByName(name) {
                return this.plugins.find(p => p.name === name);
            }
            
            injectToIframe(iframeWindow, pluginId = null) {
                if (!iframeWindow || !iframeWindow.document) return;
                
                const pluginsToInject = pluginId 
                    ? this.plugins.filter(p => p.id === pluginId && p.enabled)
                    : this.plugins.filter(p => p.enabled);
                
                console.log('[PluginManager] 注入插件到iframe:', pluginsToInject.length);
                
                pluginsToInject.forEach(plugin => {
                    try {
                        const script = iframeWindow.document.createElement('script');
                        script.textContent = `
                            try {
                                // 插件: ${plugin.name}
                                (function() {
                                    'use strict';
                                    ${plugin.code}
                                })();
                                console.log('插件 ${plugin.name} 已加载');
                            } catch(e) {
                                console.error('插件 ${plugin.name} 执行错误:', e);
                            }
                        `;
                        
                        iframeWindow.document.head.appendChild(script);
                        console.log('[PluginManager] 注入插件:', plugin.name);
                    } catch (error) {
                        console.error(`[PluginManager] 注入插件 ${plugin.name} 失败:`, error);
                    }
                });
            }
        }

        // AccountManager 类 - 管理账号数据
        class AccountManager {
            constructor() {
                this.accounts = [];
                this.accountCounter = 0;
                this.loadAccounts();
            }
            
            addAccount(fileName, hexContent, fileSize, accountData = null) {
                const accountId = ++this.accountCounter;
                const account = {
                    id: accountId,
                    fileName: fileName,
                    hexContent: hexContent,
                    fileSize: fileSize,
                    importTime: Date.now(),
                    accountData: accountData,
                    containerPage: null,
                    containerId: null,
                    lastUsed: null,
                    cardElement: null
                };
                
                this.accounts.push(account);
                this.saveAccounts();
                console.log('[AccountManager] 添加账号:', fileName);
                return account;
            }
            
            removeAccount(accountId) {
                const index = this.accounts.findIndex(acc => acc.id === accountId);
                if (index !== -1) {
                    const account = this.accounts[index];
                    this.accounts.splice(index, 1);
                    this.saveAccounts();
                    console.log('[AccountManager] 删除账号:', account.fileName);
                    return true;
                }
                return false;
            }
            
            getAccount(accountId) {
                return this.accounts.find(acc => acc.id === accountId);
            }
            
            linkToContainer(accountId, containerPage, containerId) {
                const account = this.getAccount(accountId);
                if (account) {
                    account.containerPage = containerPage;
                    account.containerId = containerId;
                    account.lastUsed = Date.now();
                    this.saveAccounts();
                    console.log('[AccountManager] 链接账号到容器:', account.fileName, '->', containerPage);
                    return true;
                }
                return false;
            }
            
            saveAccounts() {
                try {
                    const accountsToSave = this.accounts.map(acc => ({
                        ...acc,
                        hexContent: acc.hexContent
                    }));
                    localStorage.setItem('account-manager-accounts', JSON.stringify(accountsToSave));
                    localStorage.setItem('account-manager-counter', this.accountCounter.toString());
                    console.log('[AccountManager] 保存账号:', this.accounts.length);
                } catch (e) {
                    console.error('[AccountManager] 保存账号数据失败:', e);
                }
            }
            
            loadAccounts() {
                try {
                    const saved = localStorage.getItem('account-manager-accounts');
                    const counter = localStorage.getItem('account-manager-counter');
                    
                    if (saved) {
                        this.accounts = JSON.parse(saved);
                        this.accountCounter = parseInt(counter) || this.accounts.length;
                        console.log('[AccountManager] 加载账号:', this.accounts.length);
                        return this.accounts;
                    }
                } catch (e) {
                    console.error('[AccountManager] 加载账号数据失败:', e);
                }
                return [];
            }
        }
